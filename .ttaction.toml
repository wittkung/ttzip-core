[project]
name = "ttzip-core"
description = "Archiving & compression micro-kernel for macOS and Apple silicon"

[project.min_tools]
rustc = "1.85"
cargo = "1.85"

[env]
RUST_BACKTRACE = "1"

[[stage]]
name = "loc-gate"
description = "Single-file LOC gate (<=800 LOC)"
run = "./scripts/lint_loc_gate.sh"
sources = ["rust/**/*.rs", "Sources/**/*.swift"]

[[stage]]
name = "rust-test"
description = "Rust workspace test suite"
run = "cd rust && cargo test --workspace"
depends_on = ["loc-gate"]
sources = ["rust/**/*.rs", "rust/**/Cargo.toml"]
timeout = 300

[[stage]]
name = "swift-test"
description = "Swift package build and test suite"
run = "./scripts/build_rust.sh --debug && swift test"
depends_on = ["loc-gate"]
sources = ["Sources/**/*.swift", "Tests/**/*.swift", "Package.swift"]
platforms = ["macos"]
timeout = 300
