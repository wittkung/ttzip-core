<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
      .grid-line { stroke: #F1F5F9; stroke-width: 1.2; }
      .axis-text { font-size: 14px; fill: #64748B; }
      .eff-text { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    </style>
  </defs>

  <!-- 极简纯白背景 -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 顶部品牌标识与主标题 -->
  <text x="800" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB">✦ TTZip Engine 2026</text>
  <text x="800" y="108" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">7Z Format Pareto Benchmark (TTZip vs. 7-Zip Official ARM64)</text>

  <!-- 右上角 efficiency 提示 -->
  <text x="1470" y="158" text-anchor="end" class="eff-text">most efficient ↗</text>
  <line x1="130" y1="780.0" x2="1470" y2="780.0" class="grid-line"/>
  <text x="114" y="784.0" text-anchor="end" class="axis-text">10 MB/s</text>
  <line x1="130" y1="650.8" x2="1470" y2="650.8" class="grid-line"/>
  <text x="114" y="654.8" text-anchor="end" class="axis-text">50 MB/s</text>
  <line x1="130" y1="595.2" x2="1470" y2="595.2" class="grid-line"/>
  <text x="114" y="599.2" text-anchor="end" class="axis-text">100 MB/s</text>
  <line x1="130" y1="465.9" x2="1470" y2="465.9" class="grid-line"/>
  <text x="114" y="469.9" text-anchor="end" class="axis-text">500 MB/s</text>
  <line x1="130" y1="410.3" x2="1470" y2="410.3" class="grid-line"/>
  <text x="114" y="414.3" text-anchor="end" class="axis-text">1,000 MB/s</text>
  <line x1="130" y1="354.7" x2="1470" y2="354.7" class="grid-line"/>
  <text x="114" y="358.7" text-anchor="end" class="axis-text">2,000 MB/s</text>
  <line x1="130" y1="281.1" x2="1470" y2="281.1" class="grid-line"/>
  <text x="114" y="285.1" text-anchor="end" class="axis-text">5,000 MB/s</text>
  <line x1="130" y1="225.5" x2="1470" y2="225.5" class="grid-line"/>
  <text x="114" y="229.5" text-anchor="end" class="axis-text">10,000 MB/s</text>
  <text x="130.0" y="810" text-anchor="middle" class="axis-text">96%</text>
  <text x="465.0" y="810" text-anchor="middle" class="axis-text">97%</text>
  <text x="800.0" y="810" text-anchor="middle" class="axis-text">98%</text>
  <text x="1135.0" y="810" text-anchor="middle" class="axis-text">99%</text>
  <text x="1470.0" y="810" text-anchor="middle" class="axis-text">100%</text>
  <path d="M 417.4 356.7 C 436.6 353.3, 455.7 349.9, 474.9 346.5 " stroke="rgba(37, 99, 235, 0.18)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 417.4 356.7 C 436.6 353.3, 455.7 349.9, 474.9 346.5 " stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 535.8 332.6 C 842.6 335.1, 1149.3 332.6, 1456.0 671.6 C 1456.2 671.8, 1456.4 713.4, 1456.6 734.4 " stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="535.8" cy="332.6" r="4.5" fill="#D97706"/>
  <text x="535.8" y="348.6" text-anchor="middle" font-size="11" fill="#D97706">7-zip-7z-fast</text>
  <circle cx="474.9" cy="346.5" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <g transform="translate(366.9, 310.5)">
    <rect width="216" height="26" rx="13" fill="#2563EB"/>
    <text x="108" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ttzip-7z-fast (2.2 GB/s)</text>
  </g>
  <circle cx="417.4" cy="356.7" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <g transform="translate(318.4, 326.7)">
    <rect width="198" height="22" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="99" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">ttzip-7z-normal (1.9 GB/s)</text>
  </g>
  <circle cx="1456.0" cy="671.6" r="4.5" fill="#D97706"/>
  <text x="1456.0" y="687.6" text-anchor="middle" font-size="11" fill="#D97706">7-zip-7z-normal</text>
  <circle cx="1456.6" cy="734.4" r="4.5" fill="#D97706"/>
  <text x="1456.6" y="750.4" text-anchor="middle" font-size="11" fill="#D97706">7-zip-7z-ultra</text>
  <text x="800" y="845" text-anchor="middle" font-size="14" font-weight="500" fill="#475569">Space Savings Ratio (%, Higher is Better)</text>
  <text x="800" y="875" text-anchor="middle" font-size="12" fill="#94A3B8">Source: TTZip Benchmark Engine · 100MB Wikipedia Corpus (enwik8) · Apple Silicon M-Series (mach_absolute_time)</text>
</svg>