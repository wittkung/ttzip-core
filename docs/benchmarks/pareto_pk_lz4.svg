<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
      .grid-line { stroke: #F1F5F9; stroke-width: 1.2; }
      .axis-text { font-size: 14px; fill: #64748B; }
      .eff-text { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    </style>
  </defs>

  <!-- 极简纯白背景 -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 顶部品牌标识与主标题 -->
  <text x="800" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB">✦ TTZip Engine 2026</text>
  <text x="800" y="108" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">LZ4 Memory-Speed Pareto Benchmark (TTZip vs. System Native)</text>

  <!-- 右上角 efficiency 提示 -->
  <text x="1470" y="158" text-anchor="end" class="eff-text">most efficient ↗</text>
  <line x1="130" y1="780.0" x2="1470" y2="780.0" class="grid-line"/>
  <text x="114" y="784.0" text-anchor="end" class="axis-text">1,000 MB/s</text>
  <line x1="130" y1="638.7" x2="1470" y2="638.7" class="grid-line"/>
  <text x="114" y="642.7" text-anchor="end" class="axis-text">2,000 MB/s</text>
  <line x1="130" y1="452.0" x2="1470" y2="452.0" class="grid-line"/>
  <text x="114" y="456.0" text-anchor="end" class="axis-text">5,000 MB/s</text>
  <line x1="130" y1="310.8" x2="1470" y2="310.8" class="grid-line"/>
  <text x="114" y="314.8" text-anchor="end" class="axis-text">10,000 MB/s</text>
  <text x="130.0" y="810" text-anchor="middle" class="axis-text">90%</text>
  <text x="353.3" y="810" text-anchor="middle" class="axis-text">91%</text>
  <text x="576.7" y="810" text-anchor="middle" class="axis-text">92%</text>
  <text x="800.0" y="810" text-anchor="middle" class="axis-text">93%</text>
  <text x="1023.3" y="810" text-anchor="middle" class="axis-text">94%</text>
  <text x="1246.7" y="810" text-anchor="middle" class="axis-text">95%</text>
  <text x="1470.0" y="810" text-anchor="middle" class="axis-text">96%</text>
  <path d="M 1012.2 532.0 C 1098.6 576.5, 1184.9 621.1, 1271.3 665.6 " stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="335.7" cy="319.1" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <g transform="translate(223.7, 283.1)">
    <rect width="224" height="26" rx="13" fill="#2563EB"/>
    <text x="112" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ttzip-lz4-fast (9.6 GB/s)</text>
  </g>
  <circle cx="1012.2" cy="532.0" r="4.5" fill="#059669"/>
  <text x="1012.2" y="548.0" text-anchor="middle" font-size="11" fill="#059669">lz4-cli-l1-fast</text>
  <circle cx="1271.3" cy="665.6" r="4.5" fill="#059669"/>
  <text x="1271.3" y="681.6" text-anchor="middle" font-size="11" fill="#059669">lz4-cli-l9-hc</text>
  <text x="800" y="845" text-anchor="middle" font-size="14" font-weight="500" fill="#475569">Space Savings Ratio (%, Higher is Better)</text>
  <text x="800" y="875" text-anchor="middle" font-size="12" fill="#94A3B8">Source: TTZip Benchmark Engine · 100MB Wikipedia Corpus (enwik8) · Apple Silicon M-Series (mach_absolute_time)</text>
</svg>