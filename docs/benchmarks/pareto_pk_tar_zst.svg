<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
      .grid-line { stroke: #F1F5F9; stroke-width: 1.2; }
      .axis-text { font-size: 14px; fill: #64748B; }
      .eff-text { font-size: 13px; font-weight: 500; fill: #94A3B8; }
    </style>
  </defs>

  <!-- 极简纯白背景 -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- 顶部品牌标识与主标题 -->
  <text x="800" y="65" text-anchor="middle" font-size="15" font-weight="600" fill="#2563EB">✦ TTZip Engine 2026</text>
  <text x="800" y="108" text-anchor="middle" font-size="34" font-weight="700" fill="#0F172A">TAR.ZST Modern Stream Pareto Benchmark (TTZip Direct Pipeline)</text>

  <!-- 右上角 efficiency 提示 -->
  <text x="1470" y="158" text-anchor="end" class="eff-text">most efficient ↗</text>
  <line x1="130" y1="780.0" x2="1470" y2="780.0" class="grid-line"/>
  <text x="114" y="784.0" text-anchor="end" class="axis-text">100 MB/s</text>
  <line x1="130" y1="650.8" x2="1470" y2="650.8" class="grid-line"/>
  <text x="114" y="654.8" text-anchor="end" class="axis-text">500 MB/s</text>
  <line x1="130" y1="595.2" x2="1470" y2="595.2" class="grid-line"/>
  <text x="114" y="599.2" text-anchor="end" class="axis-text">1,000 MB/s</text>
  <line x1="130" y1="539.5" x2="1470" y2="539.5" class="grid-line"/>
  <text x="114" y="543.5" text-anchor="end" class="axis-text">2,000 MB/s</text>
  <line x1="130" y1="465.9" x2="1470" y2="465.9" class="grid-line"/>
  <text x="114" y="469.9" text-anchor="end" class="axis-text">5,000 MB/s</text>
  <line x1="130" y1="410.3" x2="1470" y2="410.3" class="grid-line"/>
  <text x="114" y="414.3" text-anchor="end" class="axis-text">10,000 MB/s</text>
  <text x="130.0" y="810" text-anchor="middle" class="axis-text">96%</text>
  <text x="465.0" y="810" text-anchor="middle" class="axis-text">97%</text>
  <text x="800.0" y="810" text-anchor="middle" class="axis-text">98%</text>
  <text x="1135.0" y="810" text-anchor="middle" class="axis-text">99%</text>
  <text x="1470.0" y="810" text-anchor="middle" class="axis-text">100%</text>
  <path d="M 432.5 424.3 C 677.0 414.5, 921.5 404.7, 1166.0 394.9 " stroke="rgba(37, 99, 235, 0.18)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 432.5 424.3 C 677.0 414.5, 921.5 404.7, 1166.0 394.9 " stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 445.2 450.7 C 751.5 450.7, 1057.8 450.7, 1364.1 455.6 C 1395.7 456.2, 1427.3 631.4, 1458.8 719.3 " stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="1166.0" cy="394.9" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <g transform="translate(1042.0, 358.9)">
    <rect width="248" height="26" rx="13" fill="#2563EB"/>
    <text x="124" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ttzip-tar.zst-l3 (12.1 GB/s)</text>
  </g>
  <circle cx="432.5" cy="424.3" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>
  <g transform="translate(312.5, 388.3)">
    <rect width="240" height="26" rx="13" fill="#2563EB"/>
    <text x="120" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ttzip-tar.zst-l1 (8.4 GB/s)</text>
  </g>
  <circle cx="445.2" cy="450.7" r="4.5" fill="#059669"/>
  <text x="445.2" y="466.7" text-anchor="middle" font-size="11" fill="#059669">zstd-cli-l1--t0</text>
  <circle cx="1364.1" cy="455.6" r="4.5" fill="#059669"/>
  <text x="1364.1" y="471.6" text-anchor="middle" font-size="11" fill="#059669">zstd-cli-l3--t0</text>
  <circle cx="1458.8" cy="719.3" r="4.5" fill="#059669"/>
  <text x="1458.8" y="735.3" text-anchor="middle" font-size="11" fill="#059669">zstd-cli-l19--t0</text>
  <text x="800" y="845" text-anchor="middle" font-size="14" font-weight="500" fill="#475569">Space Savings Ratio (%, Higher is Better)</text>
  <text x="800" y="875" text-anchor="middle" font-size="12" fill="#94A3B8">Source: TTZip Benchmark Engine · 100MB Wikipedia Corpus (enwik8) · Apple Silicon M-Series (mach_absolute_time)</text>
</svg>