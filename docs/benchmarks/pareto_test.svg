<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --card-bg: #f8fafc;
        --grid-major: #cbd5e1;
        --grid-minor: #f1f5f9;
        --axis: #475569;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --pareto-line: #d97706;
        --pareto-fill: rgba(217, 119, 6, 0.12);
        --pt-pareto: #f59e0b;
        --pt-regular: #3b82f6;
        --tooltip-bg: rgba(15, 23, 42, 0.95);
        --tooltip-text: #ffffff;
        --tooltip-border: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --card-bg: #1e293b;
          --grid-major: #334155;
          --grid-minor: #1e293b;
          --axis: #94a3b8;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --pareto-line: #fbbf24;
          --pareto-fill: rgba(251, 191, 36, 0.15);
