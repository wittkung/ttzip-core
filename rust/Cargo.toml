[workspace]
members = [
    "ttzip-engine",
    "ttzip-tui",
    "ttzip-python",
    "ttzip-node",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
authors = ["Witt Kung <witt.w.kung@gmail.com>"]
license = "BSD-3-Clause OR Apache-2.0"
repository = "https://github.com/wittkung/ttzip-core"
homepage = "https://github.com/wittkung/ttzip-core"
documentation = "https://github.com/wittkung/ttzip-core"
edition = "2021"
keywords = ["compression", "zip", "7z", "simd", "archive"]
categories = ["compression", "command-line-utilities", "filesystem"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = true





[profile.test]
opt-level = 1
debug = 1
codegen-units = 16
split-debuginfo = "unpacked"

[profile.test.package."*"]
opt-level = 3

[profile.test.package.ttzip-engine]
opt-level = 3


[workspace.lints.rust]
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[workspace.lints.clippy]
not_unsafe_ptr_arg_deref = "allow"
needless_range_loop = "allow"
