[workspace]
members = [
    "ttzip-engine",
    "ttzip-bindgen",
    "ttzip-tui",
    "ttzip-python",
    "ttzip-node",
    "crates/ttzip-types",
    "crates/ttzip-crypto",
    "crates/ttzip-codecs",
    "crates/ttzip-archive",
    "crates/ttzip-semantic",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Witt Kung <witt.w.kung@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/wittkung/ttzip-core"
homepage = "https://github.com/wittkung/ttzip-core"
documentation = "https://github.com/wittkung/ttzip-core"
edition = "2021"
keywords = ["compression", "zip", "7z", "simd", "archive"]
categories = ["compression", "command-line-utilities", "filesystem"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"





[profile.test]
opt-level = 2
debug = 1
codegen-units = 16
split-debuginfo = "off"

[profile.test.package."*"]
opt-level = 3

[profile.test.package.ttzip-engine]
opt-level = 3


[workspace.lints.rust]
warnings = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs"))'] }

[workspace.lints.clippy]
missing_safety_doc = "allow"
not_unsafe_ptr_arg_deref = "allow"
too_many_arguments = "allow"
only_used_in_recursion = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
needless_range_loop = "allow"
should_implement_trait = "allow"

