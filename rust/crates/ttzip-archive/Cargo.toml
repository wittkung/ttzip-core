[package]
name = "ttzip-archive"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Safe Rust High-Throughput Archiving Containers and Stream Decompression State Machines"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ttzip-types = { path = "../ttzip-types" }
ttzip-crypto = { path = "../ttzip-crypto" }
ttzip-codecs = { path = "../ttzip-codecs" }

libc = "0.2"
parking_lot = "0.12"
rayon = "1.10"
bytes = "1.10"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
globset = "0.4"
memmap2 = "0.9"
crossbeam-utils = "0.8"
log = "0.4"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
crc32fast = "1.4"
sha2 = "0.10"
brotli = "7.0"
flate2 = "1.0"
adler2 = "2.0"
snap = "1.1"
ppmd-rust = "1"
chardetng = "0.1"
encoding_rs = "0.8"
[features]
default = []




[dev-dependencies]
tempfile = "3.12"
proptest = "1.5"
hex = "0.4"
crc32fast = "1.4"
