[package]
name = "ttzip-codecs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Safe Rust High-Performance Compression and Decompression Codecs"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ttzip-types = { path = "../ttzip-types" }
ttzip-crypto = { path = "../ttzip-crypto" }
adler2 = "2.0"
brotli = "7.0"
bytes = "1.10"
chardetng = "0.1"
crc32fast = "1.4"
crossbeam-utils = "0.8"
encoding_rs = "0.8"
flate2 = "1.0"
libc = "0.2"
log = "0.4"
parking_lot = "0.12"
ppmd-rust = "1"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
snap = "1.1"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }

[dev-dependencies]
hex = "0.4"
proptest = "1.5"
tempfile = "3.17"

[build-dependencies]
cc = "1.0"
