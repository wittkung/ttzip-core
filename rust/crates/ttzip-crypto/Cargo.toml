[package]
name = "ttzip-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Safe Rust TTZip Hardware-Accelerated Cryptography and Hash Microkernel"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ttzip-types = { path = "../ttzip-types" }
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
crc32fast = "1.4"
adler2 = "2.0"
parking_lot = "0.12"
rayon = "1.10"
bytes = "1.10"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-normalization = "0.1"

[dev-dependencies]
hex = "0.4"
proptest = "1.5"
tempfile = "3.17"
