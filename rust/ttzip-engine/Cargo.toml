[package]
name = "ttzip-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Safe Rust High-Throughput Archiving, Compression, and Microkernel Engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "ttzip_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[[bench]]
name = "ab_perf_suite"
harness = false

[dependencies]
libc = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
log = "0.4"
rayon = "1.10"
globset = "0.4"
crossbeam-utils = "0.8"
parking_lot = "0.12"
snap = "1.1"
brotli = "7.0"
flate2 = "1.0"
crc32fast = "1.4"
ppmd-rust = "1"
adler2 = "2.0"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = { version = "0.28", features = ["cli"] }
memmap2 = "0.9"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
symphonia = { version = "0.5", features = ["all"] }
sha2 = "0.10"
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "zeroize"] }
subtle = { version = "2.6", default-features = false }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
quick-xml = "0.36"
roxmltree = { version = "0.20", optional = true }
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"], optional = true }
zune-core = { version = "0.4", optional = true }
zune-image = { version = "0.4", optional = true }
image-webp = { version = "0.2", optional = true }
tree-sitter = { version = "0.22", optional = true }
tree-sitter-rust = { version = "0.21", optional = true }
tree-sitter-c = { version = "0.21", optional = true }
tree-sitter-python = { version = "0.21", optional = true }
tree-sitter-javascript = { version = "0.21", optional = true }
tree-sitter-typescript = { version = "0.21", optional = true }
tree-sitter-json = { version = "0.21", optional = true }
tree-sitter-html = { version = "0.20", optional = true }
tree-sitter-css = { version = "0.21", optional = true }
tree-sitter-md = { version = "0.2", optional = true }
tree-sitter-swift = { version = "0.5", optional = true }

[features]
default = ["full"]
archive = []
probe = ["dep:roxmltree", "dep:lopdf", "dep:zune-core", "dep:zune-image", "dep:image-webp"]
syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-c",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-html",
    "dep:tree-sitter-css",
    "dep:tree-sitter-md",
    "dep:tree-sitter-swift",
]
media-player = []
full = ["archive", "probe", "syntax", "media-player"]

[dev-dependencies]
hex = "0.4"
crc32fast = "1.4"
adler2 = "2.0"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.12"
flate2 = "1.0"
tar = "0.4"
jpeg-encoder = "0.5"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }


[build-dependencies]
cc = "1.0"
uniffi = { version = "0.28", features = ["build"] }
