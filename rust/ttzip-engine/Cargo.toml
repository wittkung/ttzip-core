[package]
name = "ttzip-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pure Safe Rust High-Throughput Archiving, Compression, and Microkernel Engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "ttzip_engine"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
libc = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
cfg-if = "1.0"
log = "0.4"
rayon = "1.10"
globset = "0.4"
crossbeam-utils = "0.8"
parking_lot = "0.12"
snap = "1.1"
brotli = "7.0"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uniffi = { version = "0.28", features = ["cli"] }
memmap2 = "0.9"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
symphonia = { version = "0.5", features = ["all"] }
tt_i18n = { package = "tt-i18n-core", path = "../../../ttkit-localization/tt-i18n-core" }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
crc32fast = "1.4"
adler2 = "2.0"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.12"
flate2 = "1.0"
tar = "0.4"

[build-dependencies]
cc = "1.0"
uniffi = { version = "0.28", features = ["build"] }
