[package]
name = "ttzip-glue"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TTZip core native glue layer implemented in Safe Rust with hardware acceleration"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
[lints]
workspace = true

[lib]
name = "ttzip_glue"
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
cfg-if = "1.0"
log = "0.4"
rayon = "1.10"
globset = "0.4"
crossbeam-utils = "0.8"
parking_lot = "0.12"
snap = "1.1"
brotli = "7.0"
encoding_rs = "0.8"
chardetng = "0.1"
unicode-normalization = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
crc32fast = "1.4"
adler2 = "2.0"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.12"
flate2 = "1.0"
tar = "0.4"

[[bench]]
name = "bench_crypto"
harness = false

[[bench]]
name = "bench_codecs"
harness = false

[[bench]]
name = "bench_zip_parallel"
harness = false

[[bench]]
name = "bench_sevenz_solid"
harness = false
