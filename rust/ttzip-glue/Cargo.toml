[package]
name = "ttzip-glue"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TTZip C-ABI export and staticlib glue layer wrapping ttzip-engine"
repository.workspace = true

[lints]
workspace = true

[lib]
name = "ttzip_glue"
crate-type = ["staticlib", "rlib"]

[dependencies]
ttzip-engine = { path = "../ttzip-engine", version = "1.0.0" }
libc = "0.2"
zeroize = { version = "1.8", features = ["zeroize_derive", "alloc"] }
log = "0.4"

[dev-dependencies]
tempfile = "3.12"
hex = "0.4"
sha2 = "0.10"
crc32fast = "1.4"
adler2 = "2.0"
aes = "0.8"
ctr = "0.9"
cbc = "0.1"
proptest = "1.5"
flate2 = "1.0"
tar = "0.4"
