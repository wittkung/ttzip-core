# cbindgen configuration for TTZip Rust Glue

language = "C"
include_guard = "TTZIP_RUST_GLUE_H"
header = """// SPDX-License-Identifier: BSD-3-Clause OR Apache-2.0
//
// Copyright (c) 2026 Witt Kung <witt.w.kung@gmail.com>
// All rights reserved.
//
// TTZip: High-performance native archiving and compression engine for macOS.
// Auto-generated by cbindgen / TTZip build pipeline. DO NOT EDIT DIRECTLY.

#ifdef TTZIP_STATUS_OK
#undef TTZIP_STATUS_OK
#endif
#ifdef TTZIP_STATUS_EOF
#undef TTZIP_STATUS_EOF
#endif
"""

autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
tab_width = 4
style = "type"

[export]
include = [
    "TTZipStatus",
    "TTZipArchiveFormat",
    "TTZipCompressionLevel",
    "TTZipEncryptionMethod",
    "TTZipLogLevel",
    "TTZipEntryMetadata",
    "TTZipProgressCallback",
    "TTZipInspectCallback",
    "TTZipExtractOptions",
    "TTZipCreateOptions",
    "TTZipAes256Context",
]

[enum]
prefix_with_name = false

[struct]
rename_fields = "SnakeCase"
